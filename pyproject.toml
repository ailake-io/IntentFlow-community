[project]
name = "intentflow"
dynamic = ["version"]
description = "Control layer for data pipelines: column lineage, preventive checks, orchestrator visibility and impact of external jobs"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Thiago Egon Lange" }]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Database"]
# sqlglot internals drive column lineage: new majors are tested before the bound moves
dependencies = ["sqlglot>=25,<31", "pyyaml>=6,<7", "duckdb>=1.0,<2"]

[project.optional-dependencies]
postgres = ["psycopg2-binary"]
snowflake = ["snowflake-connector-python"]
bigquery = ["google-cloud-bigquery"]
databricks = ["databricks-sql-connector"]
kafka = ["kafka-python-ng"]
lint = ["sqlfluff"]
aws = ["boto3"]
jev = ["typesafe-sdk"]
mysql = ["pymysql"]
secrets = ["cryptography"]
lakehouse = ["deltalake", "pyiceberg"]
warehouses = ["trino", "clickhouse-connect"]
dev = [
    "pytest",
    "dbt-core",
    "dbt-duckdb",
    "moto[glue]",
]

[project.scripts]
intentflow = "intentflow.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "intentflow.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intentflow = ["web.html", "locale/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
# pyflakes (unused/undefined names, shadowing) + syntax errors + bugbear; style is not enforced on existing code
select = ["F", "E9", "B", "UP", "SIM"]
ignore = ["B905", "SIM105"]   # zip(strict=) and contextlib.suppress are style choices here

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported and then requested by name
"tests/*" = ["F811", "F841", "B017", "UP031", "SIM113"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
