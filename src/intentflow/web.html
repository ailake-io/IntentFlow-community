<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IntentFlow</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#e3e6eb;--fg:#15191e;--mut:#5d6672;--faint:#8a93a0;
  --acc:#4f46e5;--acc-fg:#fff;--acc-soft:#eef0ff;
  --crit:#b42318;--crit-bg:#fee4e2;--high:#c4320a;--high-bg:#ffead5;--med:#a15c07;--med-bg:#fef0c7;--low:#175cd3;--low-bg:#d1e9ff;--info:#475467;--info-bg:#eaecf0;
  --ok:#067647;--ok-bg:#d1fadf;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --diff-add:#e6f6ec;--diff-del:#fdecea;--radius:12px}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1216;--panel:#171b21;--panel2:#1d222a;--line:#2a313b;--fg:#e8eaee;--mut:#a3acb8;--faint:#7c8695;
  --acc:#8b8cff;--acc-fg:#10121a;--acc-soft:#232650;
  --crit:#ff8a80;--crit-bg:#3d1714;--high:#ffa062;--high-bg:#3d2312;--med:#f5c453;--med-bg:#382b0c;--low:#7db4ff;--low-bg:#14263f;--info:#b4bcc8;--info-bg:#262c35;
  --ok:#5fd68e;--ok-bg:#0f2f1e;--shadow:none;--diff-add:#10301f;--diff-del:#3a1714}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.app.login{grid-template-columns:minmax(0,1fr)}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:4px 8px 14px}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--acc),#a855f7);display:inline-block}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;color:var(--mut);text-decoration:none;font-weight:500;cursor:pointer}
nav a:hover{background:var(--panel2);color:var(--fg)}nav a.on{background:var(--acc-soft);color:var(--acc)}
nav .cnt{font-size:12px;background:var(--panel2);padding:1px 8px;border-radius:99px;color:var(--mut)}
nav a.on .cnt{background:var(--panel);color:var(--acc)}nav .cnt.hot{background:var(--crit-bg);color:var(--crit)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:8px}
.side-foot small{color:var(--faint)}
main{padding:28px 36px 60px;max-width:1240px;width:100%;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0}
.sub{color:var(--mut);margin:0 0 22px}
.btn{display:inline-block;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:7px 12px;border-radius:8px;font-weight:500}
.btn:hover{background:var(--panel2)}.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12.5px}.btn.ghost{border-color:transparent;background:transparent;color:var(--mut)}.btn[disabled]{opacity:.5;cursor:default}
.btn.danger{color:var(--crit)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr))}
.card:has(table){overflow-x:auto}
.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.kpi{display:flex;flex-direction:column;gap:2px;cursor:pointer}.kpi:hover{border-color:var(--acc)}
.kpi .n{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}.kpi .l{color:var(--mut)}.kpi .d{font-size:12.5px;color:var(--faint)}
.sev{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.sev::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sev.critical{color:var(--crit);background:var(--crit-bg)}.sev.high{color:var(--high);background:var(--high-bg)}.sev.medium{color:var(--med);background:var(--med-bg)}
.sev.low{color:var(--low);background:var(--low-bg)}.sev.info{color:var(--info);background:var(--info-bg)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.pill.success,.pill.applied{color:var(--ok);background:var(--ok-bg)}.pill.failed,.pill.invalid{color:var(--crit);background:var(--crit-bg)}
.pill.running,.pill.queued,.pill.pending{color:var(--med);background:var(--med-bg)}.pill.approved{color:var(--low);background:var(--low-bg)}
.pill.other,.pill.rejected,.pill.rolled_back{color:var(--info);background:var(--info-bg)}
.stripe{border-left:4px solid var(--line)}.stripe.critical{border-left-color:var(--crit)}.stripe.high{border-left-color:var(--high)}.stripe.medium{border-left-color:var(--med)}
.stripe.low{border-left-color:var(--low)}.stripe.info{border-left-color:var(--faint)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:10px 12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.item>div:first-child{flex:1 1 260px;min-width:0}
.item .t{font-weight:600}.item .m{color:var(--mut);font-size:13px;margin-top:2px}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--mut);font-size:12.5px;margin-top:6px}
.tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--panel2);border:1px solid var(--line);padding:1px 7px;border-radius:6px;color:var(--mut)}
table{border-collapse:collapse;width:100%}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
tr.row:hover{background:var(--panel2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--panel);padding:5px 11px;border-radius:99px;font-weight:500;color:var(--mut)}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
input[type=text],input[type=search],input[type=password],select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .4s}
.bar i.warn{background:var(--med)}.bar i.bad{background:var(--crit)}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.detail{background:var(--panel2);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:13px}
.detail dt{color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-top:8px}.detail dd{margin:2px 0 0}
pre{margin:0;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.diff{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:8px}
.diff div{padding:1px 10px;font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap}.diff .a{background:var(--diff-add)}.diff .d{background:var(--diff-del)}.diff .h{color:var(--faint)}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.step{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:12.5px}.step b{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:var(--panel2);font-size:11px}
.step.done{color:var(--ok)}.step.done b{background:var(--ok-bg)}.step.now{color:var(--acc);font-weight:600}.step.now b{background:var(--acc);color:var(--acc-fg)}
.step+.step::before{content:"›";margin-right:6px;color:var(--faint)}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.field label{display:block;font-weight:600;margin-bottom:4px}.field small{display:block;color:var(--faint);margin-top:4px}.field input{width:100%}
.welcome{background:linear-gradient(135deg,var(--acc-soft),var(--panel));border:1px solid var(--line);border-radius:16px;padding:26px}
.welcome ol{margin:12px 0 18px;padding-left:20px;color:var(--mut)}.welcome li{margin:4px 0}
.toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:9}
.toast div{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:in .2s}
.toast .err{background:var(--crit);color:#fff}
@keyframes in{from{transform:translateY(8px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:10}
.modal>div{background:var(--panel);border-radius:14px;padding:22px;max-width:460px;width:92%;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
main{min-width:0}
input[type=search]{flex:1 1 200px;min-width:0}
@media(max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:static;height:auto;flex-direction:column;align-items:stretch;padding:12px;gap:8px;border-right:0;border-bottom:1px solid var(--line)}
  .logo{padding:0}
  nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  nav a{white-space:nowrap;flex:0 0 auto}
  .side-foot{margin:0;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:0}
  .side-foot select,.side-foot #who{flex:1 1 100%}
  main{padding:16px 14px 40px}
  h1{font-size:19px}
  .kpi .n{font-size:26px}
  .toolbar select{flex:1 1 140px}
}

.lin{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.lin .models{max-height:calc(100vh - 150px);overflow:auto;padding:8px}
.lin .mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;color:var(--fg)}
.lin .mrow:hover{background:var(--panel2)}.lin .mrow.on{background:var(--acc-soft);color:var(--acc)}
.lin .mrow small{color:var(--faint)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0}
.tab{border:0;background:transparent;padding:8px 12px;color:var(--mut);border-bottom:2px solid transparent;font-weight:600}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.graph{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:8px}
.graph svg text{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:var(--fg)}
.graph svg .sub{fill:var(--faint);font-size:10.5px}
.graph .nd rect{fill:var(--panel2);stroke:var(--line)}.graph .nd:hover rect,.graph .nd:focus rect{stroke:var(--acc)}
.graph .nd.center rect{fill:var(--acc-soft);stroke:var(--acc);stroke-width:2}
.graph .nd.pii rect{stroke:var(--crit)}.graph .nd{cursor:pointer;outline:none}
.graph path.e{fill:none;stroke:var(--faint);stroke-width:1.4}.graph path.e.derived{stroke-dasharray:5 4}.graph path.e.masked{stroke:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin:8px 2px}
.colrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;width:100%;text-align:left;color:var(--fg)}
.colrow:hover{border-color:var(--acc)}.colrow.on{border-color:var(--acc);background:var(--acc-soft)}
.colgrid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:1100px){.colgrid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:820px){.lin{grid-template-columns:minmax(0,1fr)}.lin .models{max-height:220px}}
</style></head><body>
<div class="app">
<aside>
  <div class="logo"><i></i>IntentFlow</div>
  <nav id="nav" aria-label="Main navigation"></nav>
  <div class="side-foot">
    <button class="btn pri" id="runbtn">Check now</button>
    <small id="lastrun">—</small>
    <div id="who" style="display:none;margin-top:6px;font-size:12.5px;color:var(--mut)"></div>
  </div>
</aside>
<main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const I18N=/*I18N*/{"lang":"en","messages":{}};
const T=(s,v)=>{let r=I18N.messages[s]||s;if(v)r=r.replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m);return r};
document.documentElement.lang=I18N.lang==='pt'?'pt-BR':'en';
const setLang=l=>{document.cookie='if_lang='+l+';path=/;max-age=31536000;samesite=strict';location.reload()};
const $=s=>document.querySelector(s);
const SEV=['critical','high','medium','low','info'];
const SEVL={critical:T("Critical"),high:T("High"),medium:T("Medium"),low:T("Low"),info:'Info'};
const STL={success:T("Success"),failed:T("Failed"),running:T("Running"),queued:T("Queued"),other:'—',pending:T("Pending"),approved:T("Approved"),invalid:T("Invalid"),applied:T("Applied"),rejected:T("Rejected"),rolled_back:T("Rolled back")};
const S={project:(()=>{try{return localStorage.getItem('if_project')||''}catch(e){return ''}})(),me:null,team:[],mine:false,notes:{},view:'overview',data:null,cfg:null,sev:new Set(),check:'',q:'',open:new Set(),busy:null};

function h(tag,attrs,...kids){const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
const fmtB=b=>{const u=['B','KB','MB','GB','TB'];let i=0;while(b>=1024&&i<4){b/=1024;i++}return b.toFixed(i?1:0)+' '+u[i]};
const ago=t=>{if(!t)return '—';const s=Math.max(0,Date.now()/1000-t);if(s<60)return T("just now");if(s<3600)return Math.floor(s/60)+T(" min ago");if(s<86400)return Math.floor(s/3600)+T(" h ago");return Math.floor(s/86400)+T(" d ago")};
const dur=s=>s==null?'—':s<90?s.toFixed(0)+' s':(s/60).toFixed(1)+' min';
const sev=s=>h('span',{class:'sev '+s},SEVL[s]||s);
const pill=s=>h('span',{class:'pill '+s},STL[s]||s);

function toast(msg,err){const t=h('div',{class:err?'err':''},msg);$('#toast').append(t);setTimeout(()=>t.remove(),err?6000:3200)}
async function api(path,opt){opt=opt||{};opt.headers={...(opt.headers||{}),'X-IntentFlow-Lang':I18N.lang,...(S.project?{'X-IntentFlow-Project':S.project}:{})};const r=await fetch(path,opt);const j=await r.json();
  if(r.status===401){S.me={user:null,auth_required:true};S.data=null;render();throw new Error(T("Log in to continue"))}
  if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j}
const post=(p,body)=>api(p,{method:'POST',headers:{'X-IntentFlow':'1','Content-Type':'application/json'},body:JSON.stringify(body||{})});
function confirmBox(title,text,okLabel,onOk){const prev=document.activeElement;
  const close=()=>{m.remove();document.removeEventListener('keydown',esc);if(prev&&prev.focus)prev.focus()};
  const esc=e=>{if(e.key==='Escape')close()};
  const ok=h('button',{class:'btn pri',onclick:()=>{close();onOk()}},okLabel);
  const m=h('div',{class:'modal',role:'dialog','aria-modal':'true','aria-label':title,onclick:e=>{if(e.target===m)close()}},
    h('div',{},h('h2',{},title),h('p',{class:'sub',style:'margin:8px 0 16px'},text),
      h('div',{style:'display:flex;gap:8px;justify-content:flex-end'},h('button',{class:'btn',onclick:close},T("Cancel")),ok)));
  document.body.append(m);document.addEventListener('keydown',esc);ok.focus()}

S.ai=undefined;
async function aiLoad(force){if(!has('ai')){S.ai=null;return}if(S.ai===undefined||force){S.ai=S.ai||null;try{S.ai=await api('/api/llm')}catch(e){S.ai={llm:{configured:false},jev:{configured:false,enabled:false},triage:{}}}render()}}
async function act(label,fn,after){try{await fn();toast(label);}catch(e){toast(e.message,true)}await load();if(after)after()}

/* ---------- data ---------- */
async function loadMe(){try{const r=await fetch('/api/me');S.me=await r.json()}catch(e){S.me={user:null,auth_required:false}}}
async function load(){
  if(!S.me)await loadMe();
  if(S.me.auth_required&&!S.me.user){render();return}
  try{[S.data,S.cfg]=await Promise.all([api('/api/overview'),api('/api/settings')])}catch(e){if(S.me&&S.me.user)toast(T("Failed to load: ")+e.message,true);return}
  if(S.me.team&&!S.team.length){try{S.team=(await api('/api/team')).team}catch(e){}}
  render()}
const sevCount=(f,s)=>f.filter(x=>x.severity===s).length;

/* ---------- navigation ---------- */
const VIEWS=[['overview',T("Overview")],['incidents',T("Incidents")],['findings',T("Findings")],['lineage',T("Lineage and impact")],['diff',T("Data diff")],['pipelines','Pipelines'],['cluster',T("Cluster and memory")],['integrations',T("Integrations")],['fixes',T("Fixes")],['config',T("Settings")],['team',T("Team")],['audit',T("Audit")]];
const has=f=>!!(S.me&&S.me.features&&S.me.features.includes(f));     // Enterprise features reported by /api/me
function langSel(){if($('#langsel'))return;$('.side-foot').append(h('select',{id:'langsel','aria-label':'Language / Idioma',onchange:e=>setLang(e.target.value)},
  [['en','English'],['pt','Português']].map(([v,l])=>h('option',{value:v,selected:v===I18N.lang},l))))}
function nav(){const d=S.data,n=$('#nav');n.replaceChildren();langSel();
  const cnt={incidents:d.incidents.length,findings:d.findings.length,pipelines:d.pipelines.filter(p=>p.last_state==='failed').length,
    fixes:d.proposals.filter(p=>['pending','approved','invalid'].includes(p.status)).length};
  const hot={incidents:d.incidents.some(i=>['critical','high'].includes(i.severity)),pipelines:cnt.pipelines>0};
  const isAdmin=S.me&&S.me.user&&S.me.user.role==='admin';
  VIEWS.filter(([k])=>(k!=='team'||(S.me&&S.me.team&&isAdmin))&&(k!=='fixes'||has('fixes'))).forEach(([k,l])=>n.append(h('a',{class:S.view===k?'on':'',href:'#/'+k,'aria-current':S.view===k?'page':null,onclick:()=>{S.view=k}},h('span',{},l),
    cnt[k]?h('span',{class:'cnt'+(hot[k]?' hot':'')},cnt[k]):null)));
  const pj=document.getElementById('projsel');
  if(pj){pj.remove()}
  if(S.me&&S.me.projects&&S.me.projects.length>1){
    const sel=h('select',{id:'projsel','aria-label':T("Project"),style:'width:100%;margin-bottom:8px',onchange:e=>{S.project=e.target.value;try{localStorage.setItem('if_project',S.project)}catch(_){ }
      S.data=null;S.cfg=null;S.lin.models=null;S.lin.sel=null;S.teamAdmin=undefined;S.notes={};load()}},
      S.me.projects.map(p=>h('option',{value:p.name,selected:p.name===(S.project||S.me.default_project)},p.name)));
    document.querySelector('.side-foot').prepend(sel)}
  const who=$('#who');
  if(S.me&&S.me.team&&S.me.user){who.style.display='block';who.replaceChildren(h('b',{style:'color:var(--fg)'},S.me.user.name),' · '+({admin:'admin',engineer:T("engineer"),viewer:T("viewer")}[S.me.user.role]),' ',
    h('a',{href:'#',style:'color:var(--acc)',onclick:async e=>{e.preventDefault();const r=await (await fetch('/api/logout',{method:'POST',headers:{'X-IntentFlow':'1'}})).json();if(r.logout_url){location.href=r.logout_url;return}S.me=null;S.data=null;await load()}},T("log out")),
    S.me.user.via==='sso'?h('span',{style:'color:var(--faint)'},' · via SSO'):h('span',{},' · ',
      h('a',{href:'#',style:'color:var(--acc)',onclick:e=>{e.preventDefault();mfaDialog()}},S.me.user.mfa?T("MFA on"):T("turn on MFA"))))}
