name: dco
on:
  pull_request:

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit in the PR carries a Signed-off-by line
        run: |
          bad=0
          for c in $(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git show -s --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+>' || { echo "missing sign-off: $c"; bad=1; }
          done
          exit $bad
