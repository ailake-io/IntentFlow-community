name: release

# On a version tag: build the wheel/sdist, write an SPDX SBOM, sign every artifact with Sigstore (keyless, GitHub OIDC)
# and attach them to the GitHub release. PyPI upload runs only when the repository variable PUBLISH_PYPI is "true"
# and a trusted publisher is configured on PyPI for this workflow (environment "pypi").
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      id-token: write   # Sigstore keyless signing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Tag matches package version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/intentflow/__init__.py').read())[1])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: pip install build && python -m build
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/intentflow-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign artifacts
        run: for f in dist/*; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "IntentFlow ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # Sigstore keyless signing
    steps:
      - uses: actions/checkout@v6
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Build, push and sign ghcr.io image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY \
            -t "$img:${GITHUB_REF_NAME#v}" -t "$img:latest" .
          docker push -q "$img:${GITHUB_REF_NAME#v}" && docker push -q "$img:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$img:${GITHUB_REF_NAME#v}")
          cosign sign --yes "$digest"
